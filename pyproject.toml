[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-flight-booking"
version = "0.1.0"
description = "Intelligent multi-agent flight advisor with price prediction, review analysis, and booking capability"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Agent orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    # LLM providers
    "langchain-groq>=0.1.0",
    "langchain-openai>=0.1.0",
    # Structured output
    "pydantic>=2.0.0",
    # API server
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    # Frontend
    "streamlit>=1.30.0",
    # Async HTTP client
    "httpx>=0.27.0",
    # Caching
    "cachetools>=5.3.0",
    # ML / NLP
    "transformers>=4.38.0",
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    # Charting
    "matplotlib>=3.8.0",
    # Logging
    "python-json-logger>=2.0.0",
    # Payments
    "stripe>=8.0.0",
    # Email
    "sendgrid>=6.10.0",
    # Web scraping
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
flight-advisor-api = "agent_system.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "N",  # naming conventions
    "W",  # pycodestyle warnings
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "N806",  # non-lowercase-variable-in-function (allows UPPER_CASE constants)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803", "N806"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
